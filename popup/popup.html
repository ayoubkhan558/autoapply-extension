<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="header">
    <img class="logo" src="../icons/icon48.png" alt="AutoApply" />
    <div>
      <div class="title">AutoApply</div>
      <div class="subtitle">Form autofiller</div>
    </div>
    <button id="openSettingsBtn" class="header__settings" title="Open settings" aria-label="Open settings"><svg
        class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg></button>
  </div>

  <label class="field-label" for="profileSelect">Active profile</label>
  <select id="profileSelect"></select>
  <button id="editProfileBtn" class="link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
    </svg><span>Edit profile data</span></button>

  <div class="quick" id="quick">
    <div class="quick__row">
      <span class="quick__key">Email</span>
      <span class="quick__val" id="qEmail">—</span>
      <button class="quick__copy" id="copyEmail" title="Copy email" aria-label="Copy email"><svg class="ico-sm"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg></button>
    </div>
    <div class="quick__row">
      <span class="quick__key">Phone</span>
      <span class="quick__val" id="qPhone">—</span>
      <button class="quick__copy" id="copyPhone" title="Copy phone" aria-label="Copy phone"><svg class="ico-sm"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg></button>
    </div>
    <div class="quick__cv">
      <svg class="ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
      <span class="quick__cv-name" id="cvBadge">No CV attached</span>
    </div>
    <div class="quick__filled" id="lastFilled"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="apply" id="tabApply">Apply</button>
    <button class="tab" data-tab="jobs" id="tabJobs">Find jobs</button>
  </div>

  <div id="panel-apply" class="panel">
    <button id="fillBtn" class="primary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg><span>Fill this page</span></button>
    <button id="selectFieldsBtn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="22" y1="12" x2="18" y2="12"></line>
        <line x1="6" y1="12" x2="2" y2="12"></line>
        <line x1="12" y1="6" x2="12" y2="2"></line>
        <line x1="12" y1="22" x2="12" y2="18"></line>
      </svg><span>Select fields to fill</span></button>
    <button id="analyzeBtn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
      </svg><span>Analyze this job</span></button>
    <button id="coverLetterBtn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="m22 7-10 5L2 7"></path>
      </svg><span>Email &amp; cover letter</span></button>
  </div>

  <div id="panel-jobs" class="panel hidden">
    <div class="jobs">
      <input id="jobRole" class="jobs-input" placeholder="Role e.g. software engineer" />
      <input id="jobLocation" class="jobs-input" placeholder="Location e.g. Pakistan" />
      <div class="jobs-sites">
        <label><input type="checkbox" id="site-lever" /> Lever</label>
        <label><input type="checkbox" id="site-greenhouse" /> Greenhouse</label>
        <label><input type="checkbox" id="site-ashby" /> Ashby</label>
        <label><input type="checkbox" id="site-workable" /> Workable</label>
        <label><input type="checkbox" id="site-indeed" /> Indeed</label>
      </div>
      <button id="findJobsBtn" class="secondary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg><span>Search on Google</span></button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <script src="../lib/fields.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>

</html>
